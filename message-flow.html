<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Message Flow</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f7f8fa;
      font-family: sans-serif;
    }
    .diagram {
      width: min(900px, calc(100vw - 48px));
      padding: 32px;
      background: white;
      border: 1px solid #dde1e7;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
  </style>
</head>
<body>
  <div class="diagram">
    <pre class="mermaid">
sequenceDiagram
    participant Sender
    participant Network
    participant Receiver

    Sender->>Network: Encrypt message
    Network-->>Receiver: Transmit encrypted message
    Receiver->>Receiver: Decrypt message
    Receiver-->>Sender: Send acknowledgement
    </pre>
  </div>
  <script>
    mermaid.initialize({ startOnLoad: true, theme: "default" });
  </script>
</body>
</html>
