security_properties:

  encryption:
    implemented: true
    mechanism: "XChaCha20-Poly1305 authenticated encryption with X25519 key exchange, HKDF-SHA256, and RSA-PSS signatures"
    keys_stored_securely: false
    plaintext_ever_logged: false
    iv_unique_per_operation: true

  accounts:
    implemented: true
    password_hashing: "Argon2id"
    rate_limiting: true
    session_invalidation_on_logout: true

  networking:
    implemented: true # HTTP
    tls_enforced: false
    certificates_validated: false

  audit_log:
    implemented: true
    log_format: "SQLite audit_logs table with timestamp, username, event, success, and details"
    tamper_evident: false
    sensitive_data_excluded: true

ux_review:
  primary_flows_screenshots_included: true
  error_messages_reviewed: true
  secure_defaults_verified: false

documentation:
  readme_complete: true
  setup_reproducible: true
  audit_instructions_complete: true
  dependency_scan_run: true

known_limitations:
  - description: "Application communicates over HTTP without TLS"
    severity: "high"
    reason_accepted: "Accepted only for the demo scope; production deployment requires HTTPS with a trusted certificate to protect credentials, session tokens, and metadata."